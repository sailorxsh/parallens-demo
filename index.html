<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14251f">
  <meta name="description" content="Parallens 用户与设备经营看板演示原型；页面数据为模拟数据。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>用户与设备经营总览 · Parallens</title>
  <link rel="stylesheet" href="./style.css?v=20261003-55">
  <script defer src="./vendor/echarts.min.js"></script>
  <script defer src="./app.js?v=20261003-55"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="app-sidebar" aria-label="页面导航">
      <div class="sidebar-inner">
        <div class="brand" aria-label="Parallens">P<span class="brand-dot">·</span> PARALLENS</div>
        <div class="brand-caption">用户与设备经营观察台</div>
        <button class="metric-search-trigger" id="open-metric-search" type="button" disabled><span>查找指标</span><kbd>⌘ K</kbd></button>
        <nav class="sidebar-nav" aria-label="主导航">
          <a class="nav-link" data-page="" href="#/">经营总览</a>
          <span class="nav-stage">诊断专题</span>
          <a class="nav-link" data-page="A" href="#/A">A · 新客与激活</a>
          <a class="nav-link" data-page="B" href="#/B">B · 活跃与留存</a>
          <a class="nav-link" data-page="C" href="#/C">C · 设备健康</a>
          <a class="nav-link" data-page="D" href="#/D">D · 订阅转化</a>
          <a class="nav-link" data-page="E" href="#/E">E · 付费价值</a>
          <a class="nav-link" data-page="F" href="#/F">F · 用户与设备结构</a>
          <a class="nav-link" data-page="G" href="#/G">G · 异常与数据质量</a>
        </nav>
        <p class="sidebar-foot">模拟数据 · 桌面原型</p>
      </div>
    </aside>
    <div class="app-content">
      <main id="main" tabindex="-1">
        <section class="load-panel" aria-labelledby="load-title">
          <p class="section-kicker">PARALLENS / OPERATIONS REVIEW</p>
          <h1 id="load-title">正在准备经营数据</h1>
          <p class="load-status" id="load-status">正在连接数据…</p>
          <progress class="load-meter" id="load-meter" max="17" value="0" aria-label="数据准备进度" aria-describedby="load-status"></progress>
          <p class="load-hint">首次打开需要准备完整模拟样本，请稍候。</p>
          <noscript><p>请开启浏览器的 JavaScript，才能查看交互看板。</p></noscript>
        </section>
      </main>
      <footer class="site-foot"><span>PARALLENS / OPERATIONS REVIEW</span><span>本看板为演示原型，数据为模拟生成</span></footer>
    </div>
  </div>
  <div id="announcement" class="visually-hidden" aria-live="polite"></div>
  <div id="metric-definition-popover" popover="auto" role="dialog" aria-label="指标口径" hidden></div>
  <dialog class="metric-search" id="metric-search" aria-labelledby="metric-search-title">
    <div class="metric-search-head"><h2 id="metric-search-title">查找经营指标</h2><button id="close-metric-search" type="button">关闭 <kbd>Esc</kbd></button></div>
    <label class="metric-search-label" for="metric-search-input">指标名称、子项、编号或业务问题</label>
    <input id="metric-search-input" type="search" placeholder="试试：日活、DAU、事件丢失率…" autocomplete="off" aria-describedby="metric-search-hint" autofocus>
    <p class="metric-search-hint" id="metric-search-hint">打开指标后保留目标页支持的筛选条件。</p>
    <p class="metric-search-count" id="metric-search-count" role="status"></p>
    <ul id="metric-search-results" class="metric-search-results"></ul>
  </dialog>
</body>
</html>
